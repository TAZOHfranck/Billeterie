<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100806" />
    <title>Retour à l’accueil — Billetterie</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        color: #fff;
        background: #100806;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 1.5rem;
        text-align: center;
      }

      p {
        color: #d1d5db;
        line-height: 1.6;
      }

      .brand {
        color: #fcd34d;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        background: #f6bd2f;
        color: #170b03;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        background: #fcd34d;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Billetterie</p>
      <h1>Cette page n’est plus disponible</h1>
      <p>Vous allez être redirigé vers l’accueil. Si la redirection ne démarre pas, utilisez le bouton ci-dessous.</p>
      <a href="/">Retour à l’accueil</a>
    </main>
    <script>
      window.setTimeout(() => window.location.replace('/'), 5000)
    </script>
  </body>
</html>
